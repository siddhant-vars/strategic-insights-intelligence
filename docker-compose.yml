version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: sii-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
    container_name: sii-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 5001
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/strategic_insights
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "5001:5001"
    volumes:
      - ./jsondata.json:/app/jsondata.json:ro

  seed:
    build:
      context: ./backend
    container_name: sii-seed
    profiles: ["seed"]
    depends_on:
      - mongo
    environment:
      MONGODB_URI: mongodb://mongo:27017/strategic_insights
    volumes:
      - ./jsondata.json:/app/jsondata.json:ro
    command: ["node", "dist/scripts/seed.js"]

  frontend:
    build:
      context: ./frontend
    container_name: sii-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:5001/api
    ports:
      - "5173:80"

volumes:
  mongo-data:
